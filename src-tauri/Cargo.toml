[package]
name = "bright-tauri"
version = "0.1.0"
description = "Bright: a desktop app for writers to develop series of books, scripts, and stories"
authors = ["Agustin Calabrese"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bright_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.14.1"
ts-rs = { version = "10", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
deunicode = "1.4"
fs2 = "0.4"
log = "0.4"

[dev-dependencies]
tempfile = "3"
