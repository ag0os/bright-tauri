<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Bright — UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg1); font-family: var(--font-body); overflow: hidden; }
  button { font-family: var(--font-body); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
  ::-webkit-scrollbar-track { background: transparent; }
  input, select, button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="UniverseSelection.jsx"></script>
<script type="text/babel" src="StoriesList.jsx"></script>
<script type="text/babel" src="StoryEditor.jsx"></script>
<script type="text/babel" src="UniverseElements.jsx"></script>
<script type="text/babel" src="VersionsDrawer.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function App() {
  const [screen, setScreen] = useState("universe-select"); // universe-select | stories | editor | universe
  const [currentUniverse, setCurrentUniverse] = useState(null);
  const [showVersions, setShowVersions] = useState(false);
  const [dark, setDark] = useState(true);

  useEffect(() => {
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  }, [dark]);

  const goUniverse = (id) => { setCurrentUniverse(id); setScreen("stories"); };

  const inApp = screen !== "universe-select";

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: "var(--bg)" }}>
      {inApp && (
        <TopBar
          universes={BrightData.universes}
          currentUniverseId={currentUniverse}
          onUniverseChange={setCurrentUniverse}
          activeTab={screen === "universe" ? "universe" : "stories"}
          onTabChange={(t) => setScreen(t === "universe" ? "universe" : "stories")}
          dark={dark}
          onToggleDark={() => setDark(!dark)}
          onOpenSettings={() => {}}
        />
      )}
      {screen === "universe-select" && (
        <UniverseSelection universes={BrightData.universes} onSelect={goUniverse} onCreate={() => goUniverse(BrightData.universes[0].id)}/>
      )}
      {screen === "stories" && (
        <StoriesList
          containers={BrightData.containers}
          stories={BrightData.stories}
          onOpenStory={(id) => setScreen("editor")}
          onNew={() => setScreen("editor")}
        />
      )}
      {screen === "editor" && (
        <StoryEditor
          storyData={BrightData.storyContent}
          onBack={() => setScreen("stories")}
          onOpenVersions={() => setShowVersions(true)}
        />
      )}
      {screen === "universe" && (
        <UniverseElements elements={BrightData.elements}/>
      )}
      {showVersions && screen === "editor" && (
        <VersionsDrawer storyData={BrightData.storyContent} onClose={() => setShowVersions(false)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
