<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_base.css">
<style>
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid transparent;cursor:pointer;transition:all 150ms var(--ease-out)}
.btn.primary{background:var(--accent);color:var(--fg-on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.secondary{background:var(--surface-2);color:var(--fg1);border-color:var(--border)}
.btn.secondary:hover{background:var(--surface-hover)}
.btn.ghost{background:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--surface-hover);color:var(--fg1)}
.btn.danger{background:transparent;color:var(--error);border-color:color-mix(in oklch, var(--error) 40%, transparent)}
.btn.danger:hover{background:var(--error-soft)}
</style>
</head>
<body><div class="card-root">
<div class="label" style="margin-bottom:12px">Buttons — 8px radius, sentence case, icon + label</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
  <button class="btn primary">+ New story</button>
  <button class="btn secondary">Cancel</button>
  <button class="btn ghost">Skip</button>
  <button class="btn danger">Delete</button>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
  <button class="btn primary" style="padding:10px 18px;font-size:15px">Continue</button>
  <button class="btn secondary" style="padding:6px 10px;font-size:13px">Small</button>
  <button class="btn primary" disabled style="opacity:0.4;cursor:not-allowed">Disabled</button>
</div>
</div></body></html>
