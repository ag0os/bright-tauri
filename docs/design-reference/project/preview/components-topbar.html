<!doctype html><html><head><meta charset="utf-8"><title>Top bar</title>
<link rel="stylesheet" href="_base.css"></head>
<body style="padding:0"><div style="height:48px;background:color-mix(in oklch, var(--surface) 85%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:20px">
  <div style="font-family:var(--font-display);font-style:italic;font-weight:600;font-size:18px;letter-spacing:-0.01em;color:var(--fg1)">Bright</div>
  <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface-2);border-radius:6px;font-size:13px;color:var(--fg2)">The Ash Cycle <span style="color:var(--fg-muted);font-size:10px">▾</span></div>
  <div style="flex:1"></div>
  <button style="background:var(--accent-subtle);color:var(--accent);font-weight:500;font-size:13px;padding:4px 10px;border-radius:6px;border:none;font-family:var(--font-body)">Stories</button>
  <button style="background:transparent;color:var(--fg2);font-size:13px;padding:4px 10px;border-radius:6px;border:none;font-family:var(--font-body)">Universe</button>
  <div style="width:1px;height:20px;background:var(--border)"></div>
  <div style="width:28px;height:28px;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--fg2)">☾</div>
</div>
<div style="padding:20px;color:var(--fg3);font-size:13px">Top bar · 48px · backdrop blur · accent-subtle for active tab</div>
</body></html>
