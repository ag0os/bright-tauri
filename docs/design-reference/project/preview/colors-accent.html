<!doctype html><html><head><meta charset="utf-8"><title>Color — Marigold accent scale</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
<div class="label" style="margin-bottom:10px">Marigold — primary accent</div>
<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:4px;height:86px">
  <div style="background:#FDF6E3;border-radius:6px"></div>
  <div style="background:#FBEAB5;border-radius:6px"></div>
  <div style="background:#F6D483;border-radius:6px"></div>
  <div style="background:#EEBB51;border-radius:6px"></div>
  <div style="background:#E29A22;border-radius:6px"></div>
  <div style="background:#D97706;border-radius:6px;outline:2px solid var(--fg1);outline-offset:2px"></div>
  <div style="background:#B45309;border-radius:6px"></div>
  <div style="background:#8B3F0A;border-radius:6px"></div>
  <div style="background:#43200A;border-radius:6px"></div>
</div>
<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px;font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-align:center">
  <div>50</div><div>100</div><div>200</div><div>300</div><div>400</div><div style="color:var(--accent);font-weight:600">500</div><div>600</div><div>700</div><div>900</div>
</div>
<div style="margin-top:14px;font-size:13px;color:var(--fg2)"><span style="color:var(--accent);font-weight:600">500</span> is the default accent. <span style="color:var(--marigold-400)">400</span> on hover (dark), <span style="color:var(--marigold-700)">700</span> on press (light).</div>
</div></body></html>
