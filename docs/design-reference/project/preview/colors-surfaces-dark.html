<!doctype html><html><head><meta charset="utf-8"><title>Color — Core surfaces (dark)</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
  <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;height:130px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label">bg</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--fg3)">#15120E</div>
  </div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;height:130px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label">surface</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--fg3)">#1F1B15</div>
  </div>
  <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;height:130px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label">surface-2</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--fg3)">#2A251D</div>
  </div>
  <div style="background:var(--surface-raised);border:1px solid var(--border);border-radius:10px;padding:14px;height:130px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label">raised</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--fg3)">#3A3328</div>
  </div>
</div></body></html>
