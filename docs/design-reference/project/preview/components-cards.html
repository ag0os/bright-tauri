<!doctype html><html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="_base.css">
<style>
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;transition:all 150ms}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.title{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--fg1);margin:0}
.sub{font-size:13px;color:var(--fg3);margin-top:2px}
.meta-row{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:12px;color:var(--fg3)}
.pill{padding:2px 8px;border-radius:999px;background:var(--accent-subtle);color:var(--accent);font-family:var(--font-body);font-size:11px;font-weight:500}
</style></head>
<body><div class="card-root" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="card"><div class="title">The Last Light</div><div class="sub">Chapter · Novel one</div><div class="meta-row"><span class="pill" style="background:var(--accent-subtle);color:var(--accent)">In progress</span><span>3,412 words</span><span>· 2m ago</span></div></div>
<div class="card"><div class="title">Ashwood</div><div class="sub">Location</div><div class="meta-row"><span class="pill" style="background:color-mix(in oklch,var(--success) 15%,transparent);color:var(--success)">3 links</span><span>updated yesterday</span></div></div>
</div></body></html>
