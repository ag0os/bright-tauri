<!doctype html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
<div class="label" style="margin-bottom:12px">Radii — soft, not harsh</div>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;text-align:center">
  <div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:4px;height:64px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">4 · tag</div></div>
  <div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;height:64px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">6</div></div>
  <div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;height:64px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">8 · btn/input</div></div>
  <div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;height:64px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">12 · card</div></div>
  <div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:16px;height:64px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">16 · panel</div></div>
  <div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:999px;height:64px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">pill</div></div>
</div>
</div></body></html>
