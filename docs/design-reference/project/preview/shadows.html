<!doctype html><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root" style="background:var(--bg-deep)">
<div class="label" style="margin-bottom:14px">Shadow / elevation</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg3);box-shadow:var(--shadow-xs)">xs</div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg3);box-shadow:var(--shadow-sm)">sm</div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg3);box-shadow:var(--shadow-md)">md</div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg3);box-shadow:var(--shadow-lg)">lg</div>
</div>
</div></body></html>
