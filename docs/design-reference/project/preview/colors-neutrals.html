<!doctype html><html><head><meta charset="utf-8"><title>Color — Ink neutrals</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
<div class="label" style="margin-bottom:10px">Ink — warm neutral ramp</div>
<div style="display:grid;grid-template-columns:repeat(11,1fr);gap:3px;height:80px">
  <div style="background:#FAF7F1;border-radius:4px;border:1px solid var(--border)"></div>
  <div style="background:#F5EFE4;border-radius:4px"></div>
  <div style="background:#E8E1D0;border-radius:4px"></div>
  <div style="background:#D4CBB5;border-radius:4px"></div>
  <div style="background:#A89E84;border-radius:4px"></div>
  <div style="background:#7A7158;border-radius:4px"></div>
  <div style="background:#544C3A;border-radius:4px"></div>
  <div style="background:#3A3328;border-radius:4px"></div>
  <div style="background:#2A251D;border-radius:4px"></div>
  <div style="background:#1F1B15;border-radius:4px"></div>
  <div style="background:#15120E;border-radius:4px"></div>
</div>
<div style="display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:6px;font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-align:center">
  <div>50</div><div>100</div><div>200</div><div>300</div><div>400</div><div>500</div><div>600</div><div>700</div><div>800</div><div>850</div><div>900</div>
</div>
<div style="margin-top:14px;font-size:13px;color:var(--fg2)">The warmth (vs. pure neutral gray) is what makes dark mode feel like ink, not chrome.</div>
</div></body></html>
