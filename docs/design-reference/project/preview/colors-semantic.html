<!doctype html><html><head><meta charset="utf-8"><title>Color — Semantic</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
  <div style="background:var(--success-soft);border:1px solid color-mix(in oklch, var(--success) 30%, transparent);border-radius:10px;padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label" style="color:var(--success)">success</div>
    <div><div style="width:24px;height:24px;border-radius:6px;background:var(--success)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">#2F7A53 moss</div></div>
  </div>
  <div style="background:var(--warning-soft);border:1px solid color-mix(in oklch, var(--warning) 30%, transparent);border-radius:10px;padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label" style="color:var(--warning)">warning</div>
    <div><div style="width:24px;height:24px;border-radius:6px;background:var(--warning)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">#B45309 amber</div></div>
  </div>
  <div style="background:var(--error-soft);border:1px solid color-mix(in oklch, var(--error) 30%, transparent);border-radius:10px;padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label" style="color:var(--error)">error</div>
    <div><div style="width:24px;height:24px;border-radius:6px;background:var(--error)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">#B0391F terracotta</div></div>
  </div>
  <div style="background:var(--info-soft);border:1px solid color-mix(in oklch, var(--info) 30%, transparent);border-radius:10px;padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="label" style="color:var(--info)">info</div>
    <div><div style="width:24px;height:24px;border-radius:6px;background:var(--info)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:6px">#4C6EA8 ink-blue</div></div>
  </div>
</div></body></html>
