<!doctype html><html><head><meta charset="utf-8"><title>Save indicator</title>
<link rel="stylesheet" href="_base.css">
<style>.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-family:var(--font-body);font-size:12px;font-weight:500}</style>
</head><body><div class="card-root">
<div class="label" style="margin-bottom:10px">Auto-save states</div>
<div style="display:flex;flex-direction:column;gap:8px">
  <span class="chip" style="background:var(--accent-subtle);color:var(--accent)">⟳ Saving</span>
  <span class="chip" style="background:color-mix(in oklch,var(--success) 15%,transparent);color:var(--success)">✓ Saved 2s ago</span>
  <span class="chip" style="background:color-mix(in oklch,var(--error) 15%,transparent);color:var(--error)">! Couldn't save — retry</span>
</div>
</div></body></html>
