<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
<div class="label" style="margin-bottom:10px">4px grid · 8px smallest visible</div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">1 · 4px</div><div style="height:10px;width:4px;background:var(--accent);border-radius:2px"></div></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">2 · 8px</div><div style="height:10px;width:8px;background:var(--accent);border-radius:2px"></div></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">3 · 12px</div><div style="height:10px;width:12px;background:var(--accent);border-radius:2px"></div></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">4 · 16px</div><div style="height:10px;width:16px;background:var(--accent);border-radius:2px"></div></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">6 · 24px</div><div style="height:10px;width:24px;background:var(--accent);border-radius:2px"></div></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">8 · 32px</div><div style="height:10px;width:32px;background:var(--accent);border-radius:2px"></div></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">12 · 48px</div><div style="height:10px;width:48px;background:var(--accent);border-radius:2px"></div></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:48px">16 · 64px</div><div style="height:10px;width:64px;background:var(--accent);border-radius:2px"></div></div>
</div>
</div></body></html>
