<!doctype html><html><head><meta charset="utf-8"><title>Type — UI &amp; mono</title>
<link rel="stylesheet" href="_base.css"></head>
<body class="bright-type"><div class="card-root">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
  <div>
    <div class="label" style="margin-bottom:8px">Geist — UI</div>
    <div style="font-family:var(--font-body);font-size:19px;font-weight:600;color:var(--fg1)">New story</div>
    <div style="font-family:var(--font-body);font-size:15px;color:var(--fg1);margin-top:6px">Sentence case, medium weight for emphasis.</div>
    <div style="font-family:var(--font-body);font-size:13px;color:var(--fg3);margin-top:4px">Secondary metadata sits one step down.</div>
  </div>
  <div>
    <div class="label" style="margin-bottom:8px">JetBrains Mono — numbers, timestamps</div>
    <div style="font-family:var(--font-mono);font-size:20px;color:var(--fg1);font-variant-numeric:tabular-nums">12,348 words</div>
    <div style="font-family:var(--font-mono);font-size:13px;color:var(--fg3);margin-top:6px">v3 · 2:14 PM · saved</div>
    <div style="font-family:var(--font-mono);font-size:13px;color:var(--fg3)">0123456789</div>
  </div>
</div>
</div></body></html>
